<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rangrez Ticket Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080504;
      color: #f5e6bd;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      margin: 10px 0 5px;
      color: #d8b66a;
      letter-spacing: 4px;
      font-size: 32px;
    }

    .subtitle {
      color: #b9a985;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .scanner-box {
      background: #120b08;
      border: 1px solid #6e5225;
      border-radius: 18px;
      padding: 15px;
    }

    #reader {
      width: 100%;
    }

    #reader video {
      width: 100% !important;
      border-radius: 12px;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      color: #c9a24d;
      font-size: 14px;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 25px;
      border-radius: 16px;
    }

    .valid {
      display: block;
      background: #102415;
      border: 1px solid #4f9b62;
    }

    .invalid {
      display: block;
      background: #2a0d0d;
      border: 1px solid #a94b4b;
    }

    .icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    h2 {
      letter-spacing: 2px;
    }

    .ticket-info {
      text-align: left;
      margin-top: 15px;
      line-height: 1.9;
    }

    strong {
      color: #d8b66a;
    }

    button {
      margin-top: 20px;
      padding: 13px 22px;
      border: none;
      border-radius: 10px;
      background: #c9a24d;
      color: #120b08;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>RANGREZ</h1>

  <div class="subtitle">
    THE GARBA NIGHT 2K26<br>
    TICKET VERIFICATION
  </div>

  <div class="scanner-box">
    <div id="reader"></div>
  </div>

  <div id="status" class="status">
    Point the camera at a ticket QR code.
  </div>

  <div id="result" class="result"></div>

</div>

<script>

let scanner = null;
let checking = false;


function escapeHtml(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function showMessage(message) {

  const result =
    document.getElementById("result");

  result.className = "result invalid";

  result.innerHTML = `

    <div class="icon">⚠️</div>

    <h2>VERIFICATION ERROR</h2>

    <p>${escapeHtml(message)}</p>

    <button onclick="scanAgain()">
      SCAN AGAIN
    </button>

  `;

}


function showValid(ticket) {

  const result =
    document.getElementById("result");

  result.className = "result valid";

  result.innerHTML = `

    <div class="icon">✓</div>

    <h2>VALID TICKET</h2>

    <div class="ticket-info">

      <div>
        <strong>Ticket ID:</strong>
        ${escapeHtml(ticket.ticketId)}
      </div>

      <div>
        <strong>Name:</strong>
        ${escapeHtml(ticket.name)}
      </div>

      <div>
        <strong>Registration No:</strong>
        ${escapeHtml(ticket.studentRegNo)}
      </div>

      <div>
        <strong>Tickets:</strong>
        ${escapeHtml(ticket.quantity)}
      </div>

      <div>
        <strong>Amount:</strong>
        ₹${escapeHtml(ticket.amount)}
      </div>

    </div>

    <button onclick="scanAgain()">
      SCAN NEXT TICKET
    </button>

  `;

}


async function verifyTicket(qrToken) {

  if (checking) return;

  checking = true;

  document.getElementById("status").innerText =
    "Checking ticket...";


  try {

    const response = await fetch(
      "/api/verify-ticket?qr_token=" +
      encodeURIComponent(qrToken),
      {
        method: "GET",
        cache: "no-store"
      }
    );


    const text =
      await response.text();


    console.log(
      "Verification response:",
      text
    );


    let data;


    try {

      data = JSON.parse(text);

    } catch (error) {

      showMessage(
        "Server returned an invalid response: " +
        text.substring(0, 200)
      );

      checking = false;

      return;
    }


    if (
      data.success &&
      data.valid &&
      data.ticket
    ) {

      stopScanner();

      document.getElementById("status").innerText =
        "Ticket verified successfully.";

      showValid(data.ticket);

      return;
    }


    if (data.alreadyUsed) {

      stopScanner();

      document.getElementById("status").innerText =
        "This ticket was already scanned.";

      const result =
        document.getElementById("result");

      result.className =
        "result invalid";

      result.innerHTML = `

        <div class="icon">⚠️</div>

        <h2>ALREADY USED</h2>

        <p>
          This ticket has already been scanned.
        </p>

        <button onclick="scanAgain()">
          SCAN NEXT TICKET
        </button>

      `;

      return;
    }


    stopScanner();

    document.getElementById("status").innerText =
      "Ticket verification failed.";

    showMessage(
      data.error ||
      "This QR code is not valid."
    );

  }

  catch (error) {

    console.error(
      "Verification error:",
      error
    );

    stopScanner();

    document.getElementById("status").innerText =
      "Connection error.";

    showMessage(
      "Unable to contact the ticket verification server."
    );

  }

}


function stopScanner() {

  if (scanner) {

    scanner.stop()
      .catch(() => {});

  }

}


function startScanner() {

  checking = false;

  document.getElementById("result").style.display =
    "none";

  document.getElementById("result").innerHTML =
    "";

  document.getElementById("status").innerText =
    "Point the camera at a ticket QR code.";


  document.getElementById("reader").innerHTML =
    "";


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      console.log(
        "QR detected:",
        decodedText
      );

      if (!checking) {

        verifyTicket(
          decodedText
        );

      }

    },

    function(errorMessage) {

      // Camera scanning errors are normal.
      // Do not display them.

    }

  )

  .catch(function(error) {

    console.error(
      "Camera error:",
      error
    );

    showMessage(
      "Camera could not start. Please allow camera permission."
    );

  });

}


function scanAgain() {

  stopScanner();

  startScanner();

}


window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);

</script>

</body>
</html>
