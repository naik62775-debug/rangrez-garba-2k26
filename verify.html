<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rangrez Ticket Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080504;
      color: #f5e6bd;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 3px;
      color: #d8b66a;
    }

    .subtitle {
      margin: 8px 0 25px;
      color: #b9a985;
      font-size: 14px;
    }

    .scanner-box {
      background: #120b08;
      border: 1px solid #6e5225;
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 0 30px rgba(180, 130, 40, 0.15);
    }

    #reader {
      width: 100%;
    }

    #reader video {
      border-radius: 12px;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
    }

    .result.valid {
      display: block;
      background: #102415;
      border: 1px solid #4f9b62;
    }

    .result.invalid {
      display: block;
      background: #2a0d0d;
      border: 1px solid #a94b4b;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .result h2 {
      margin: 8px 0;
      letter-spacing: 2px;
    }

    .result p {
      margin: 8px 0;
      color: #ddd;
    }

    button {
      margin-top: 18px;
      padding: 13px 22px;
      border: none;
      border-radius: 10px;
      background: #c9a24d;
      color: #120b08;
      font-weight: bold;
      cursor: pointer;
    }

    .ticket-info {
      margin-top: 15px;
      text-align: left;
      line-height: 1.8;
    }

    .ticket-info strong {
      color: #d8b66a;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>RANGREZ</h1>

    <div class="subtitle">
      THE GARBA NIGHT 2K26<br>
      TICKET VERIFICATION
    </div>

    <div class="scanner-box">
      <div id="reader"></div>
    </div>

    <!-- IMPORTANT:
         This is hidden when the scanner opens.
         It only appears after a QR code is scanned.
    -->
    <div id="result" class="result"></div>

  </div>


  <script>

    let checking = false;
    let scanner = null;


    function escapeHtml(text) {

      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function showResultValid(ticket) {

      const result =
        document.getElementById("result");

      result.className = "result valid";

      result.innerHTML = `

        <div class="icon">✓</div>

        <h2>VALID TICKET</h2>

        <div class="ticket-info">

          <div>
            <strong>Ticket ID:</strong>
            ${escapeHtml(ticket.ticketId)}
          </div>

          <div>
            <strong>Name:</strong>
            ${escapeHtml(ticket.name)}
          </div>

          <div>
            <strong>Registration No:</strong>
            ${escapeHtml(ticket.studentRegNo)}
          </div>

          <div>
            <strong>Tickets:</strong>
            ${escapeHtml(ticket.quantity)}
          </div>

          <div>
            <strong>Amount:</strong>
            ₹${escapeHtml(ticket.amount)}
          </div>

        </div>

        <button onclick="scanAgain()">
          SCAN NEXT TICKET
        </button>

      `;

      result.scrollIntoView({
        behavior: "smooth"
      });

    }


    function showResultInvalid(message) {

      const result =
        document.getElementById("result");

      result.className = "result invalid";

      result.innerHTML = `

        <div class="icon">✕</div>

        <h2>INVALID TICKET</h2>

        <p>
          ${escapeHtml(message)}
        </p>

        <button onclick="scanAgain()">
          SCAN AGAIN
        </button>

      `;

      result.scrollIntoView({
        behavior: "smooth"
      });

    }


    async function verifyTicket(qrToken) {

      if (checking) {
        return;
      }

      checking = true;

      try {

        const response =
          await fetch(
            "/api/verify-ticket?qr_token=" +
            encodeURIComponent(qrToken)
          );

        const data =
          await response.json();


        if (
          data.success &&
          data.valid &&
          data.ticket
        ) {

          stopScanner();

          showResultValid(
            data.ticket
          );

          return;
        }


        if (data.alreadyUsed) {

          stopScanner();

          const result =
            document.getElementById("result");

          result.className =
            "result invalid";

          result.innerHTML = `

            <div class="icon">⚠️</div>

            <h2>ALREADY USED</h2>

            <p>
              This ticket has already been scanned.
            </p>

            <button onclick="scanAgain()">
              SCAN NEXT TICKET
            </button>

          `;

          result.scrollIntoView({
            behavior: "smooth"
          });

          return;
        }


        stopScanner();

        showResultInvalid(
          data.error ||
          "This QR code is not valid."
        );


      } catch (error) {

        console.error(error);

        stopScanner();

        showResultInvalid(
          "Unable to verify this ticket. Check your internet connection."
        );

      }

    }


    function stopScanner() {

      if (scanner) {

        scanner.stop()
          .catch(() => {});

      }

    }


    function startScanner() {

      checking = false;

      const result =
        document.getElementById("result");

      result.style.display = "none";
      result.innerHTML = "";
      result.className = "result";


      scanner =
        new Html5Qrcode("reader");


      scanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },

        (decodedText) => {

          if (!checking) {

            verifyTicket(
              decodedText
            );

          }

        },

        () => {}

      ).catch(error => {

        console.error(error);

        showResultInvalid(
          "Camera could not be started. Please allow camera permission."
        );

      });

    }


    function scanAgain() {

      checking = false;

      const result =
        document.getElementById("result");

      result.style.display = "none";
      result.innerHTML = "";
      result.className = "result";

      document.getElementById("reader").innerHTML = "";

      startScanner();

    }


    // Start with a completely clean scanner screen.
    // NO ticket is checked automatically.
    window.addEventListener(
      "load",
      startScanner
    );

  </script>

</body>
</html>
